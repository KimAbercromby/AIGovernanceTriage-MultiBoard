function replaceOnce(state, oldText, newText, label) {
  const i = state.text.indexOf(oldText);
  if (i < 0) throw new Error("Pattern not found: " + label);
  if (state.text.indexOf(oldText, i + oldText.length) >= 0) throw new Error("Pattern not unique: " + label);
  state.text = state.text.slice(0, i) + newText + state.text.slice(i + oldText.length);
}

(async function boot(){
  const host=document.getElementById("loader");
  try{
    const res=await fetch(BASE_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("Unable to load governance application (HTTP "+res.status+").");
    const original=await res.text();
    const functionallyPatched=patch(original);
    const withAgenticGovernance=addAgenticGovernanceExport(functionallyPatched);
    const redesigned=applyProfessionalDesign(withAgenticGovernance);
    document.open();document.write(redesigned);document.close();
  }catch(err){
    host.innerHTML="<h1>AI Governance Triage &amp; Routing</h1>"+
      '<p class="error"><strong>The governance tool could not load.</strong><br>'+String(err.message||err)+
      "<br><br>No governance data has been submitted or altered.</p>";
  }
})();
