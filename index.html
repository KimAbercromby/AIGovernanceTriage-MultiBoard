const CORRECTION_FUNCTIONS = "\nfunction addGovernanceCorrections(html) {\n  html = html.replace(\n    /<h2 id=\"intro-title\">One front door, three proportionate routes<\\/h2>/,\n    '<h2 id=\"intro-title\">One front door, proportionate governance pathways</h2>'\n  );\n\n  html = html.replace(\n    /<p>\\s*Every system enters the same front door[\\s\\S]*?separate planned-gate export\\.\\s*<\\/p>/,\n    '<p>Every system enters the same front door and is captured once under one AIR-ID. The AGPI establishes governance priority, while the risk assessment separately classifies risk as Low, Medium, High or Critical. Governance pathway is a separate decision: genuinely low-risk, non-acting systems may use the light-touch pathway; non-agentic systems use the non-agentic governance pathway; and systems that can take actions or exercise delegated authority use the agentic governance pathway. A non-agentic system may still be High or Critical risk. Where a system can execute actions without human review of each individual action, the mandatory agentic trigger applies and the minimum effective risk tier is Critical. A governance relay carries the case across the existing forums, with configurable forum names, a decision-ready evidence plan feeding the Decision-Ready Paper (WCC-AIG-38), an Excel-ready Register row and a separate planned-gate export.</p>'\n  );\n\n  html = html.replace(\n    /<p>\\s*The light-touch route is the quick path:[\\s\\S]*?Width stays at the door; depth arrives only when the risk earns it\\.\\s*<\\/p>/,\n    '<p>The light-touch pathway is the proportionate path for genuinely low-risk systems that cannot act and have no mandatory escalation or specialist-assessment trigger. Light-touch does not mean governance stops at registration. The system still receives an AIR-ID and AI Register entry, proportionate baseline documentation including the applicable Model Card or system documentation, named ownership, proportionate controls and periodic review. Additional assessment and assurance depth is added only where the risk, impact, data use or other triggers require it.</p>'\n  );\n\n  html = html.replace(\n    'function isAgentSystem(profile, results) {\\n    return profile.capability === \"Agentic AI\" || (results.triggerIds && results.triggerIds.includes(\"agentic\"));\\n  }',\n    'function isAgentSystem(profile, results) {\\n    const canAct = profile.actionAuthority && profile.actionAuthority !== \"None — outputs only\";\\n    return profile.capability === \"Agentic AI\" || canAct || (results.triggerIds && results.triggerIds.includes(\"agentic\"));\\n  }'\n  );\n\n  html = html.replace(\n    /  function getTriggerIds\\(\\) \\{[\\s\\S]*?\\n  \\}\\n\\n  function calculateAll\\(\\) \\{/,\n`  function getTriggerIds() {\n    const agenticTrigger = form.querySelector('[data-trigger=\"agentic\"]');\n    const authorityEl = byId(\"actionAuthority\");\n    const actionAuthority = authorityEl ? authorityEl.value : \"\";\n    const autonomousWithoutPerActionReview =\n      actionAuthority === \"Acts within defined bounds — monitored\" ||\n      actionAuthority === \"Fully autonomous\";\n\n    if (agenticTrigger) {\n      if (autonomousWithoutPerActionReview) {\n        if (!agenticTrigger.checked) agenticTrigger.dataset.autoChecked = \"true\";\n        agenticTrigger.checked = true;\n        agenticTrigger.disabled = true;\n        agenticTrigger.title =\n          \"Automatically selected because the system can execute actions without human review of each individual action.\";\n      } else {\n        agenticTrigger.disabled = false;\n        agenticTrigger.removeAttribute(\"title\");\n        if (agenticTrigger.dataset.autoChecked === \"true\") {\n          agenticTrigger.checked = false;\n          delete agenticTrigger.dataset.autoChecked;\n        }\n      }\n    }\n\n    return Array.from(form.querySelectorAll(\"[data-trigger]:checked\")).map(\n      (input) => input.dataset.trigger,\n    );\n  }\n\n  function calculateAll() {`\n  );\n\n  html = html.replace(\n    /  function governanceRoute\\(profile, results\\) \\{[\\s\\S]*?\\n  \\}\\n\\n  function update\\(\\) \\{/,\n`  function governanceRoute(profile, results) {\n    const req = logic.assessmentRequirements(profile, results);\n    const canAct =\n      profile.capability === \"Agentic AI\" ||\n      (profile.actionAuthority && profile.actionAuthority !== \"None — outputs only\") ||\n      (results.triggerIds && results.triggerIds.includes(\"agentic\"));\n\n    const autonomousWithoutPerActionReview =\n      profile.actionAuthority === \"Acts within defined bounds — monitored\" ||\n      profile.actionAuthority === \"Fully autonomous\" ||\n      (results.triggerIds && results.triggerIds.includes(\"agentic\"));\n\n    const anyAssessment =\n      req.dpia === \"Yes\" || req.eia === \"Yes\" || req.humanRights ||\n      req.atrs === \"Yes\" || req.supplierDueDiligence || req.dpiaScreening;\n    const label = results.priority.label || \"\";\n    const lowPriority =\n      label.indexOf(\"Priority 4\") === 0 || label.indexOf(\"Priority 5\") === 0;\n    const lowTier = results.effectiveTierName === \"Low\";\n    const noTriggers = results.triggerIds.length === 0;\n\n    if (canAct) {\n      return {\n        key: \"agentic\",\n        name: \"Agentic governance pathway\",\n        why: autonomousWithoutPerActionReview\n          ? \"This system can execute actions without human review of each individual action. The mandatory agentic trigger therefore applies and the minimum effective risk tier is Critical. Complete the Agentic Triage, Agent Record (ASBOM), authority controls and the required assurance route.\"\n          : \"This system can act, but each individual action remains human-approved or no unreviewed autonomous action has been identified. Agentic governance controls and the Agent Record (ASBOM) still apply; a Critical risk floor is not imposed solely because the system is agentic.\"\n      };\n    }\n\n    if (lowPriority && lowTier && noTriggers && !anyAssessment) {\n      return {\n        key: \"light\",\n        name: \"Light-touch governance pathway\",\n        why: \"Low risk, low governance priority, unable to act and no mandatory or specialist trigger. Maintain the AIR-ID and Register entry, proportionate baseline documentation including the applicable Model Card or system documentation, named ownership, controls and periodic review.\"\n      };\n    }\n\n    return {\n      key: \"standard\",\n      name: \"Non-agentic governance pathway\",\n      why: \"This system does not exercise autonomous action authority. Its risk remains classified separately as Low, Medium, High or Critical, and the governance depth follows its effective risk tier, AGPI priority and any mandatory or specialist triggers.\"\n    };\n  }\n\n  function update() {`\n  );\n\n  html = html.replace(\n    'rows.push([\"Is Agent\", p.capability === \"Agentic AI\" || triggerSet.has(\"agentic\") ? \"Yes — assessment not yet run\" : \"No\"]);',\n    'rows.push([\"Is Agent\", p.capability === \"Agentic AI\" || (p.actionAuthority && p.actionAuthority !== \"None — outputs only\") || triggerSet.has(\"agentic\") ? \"Yes — assessment not yet run\" : \"No\"]);'\n  );\n\n  if (!html.includes('id=\"downloadGateReady\"')) {\n    const riskButton =\n`              <button type=\"button\" id=\"downloadRisk\" class=\"secondary\">\n                Download Risk Assessment pre-fill\n              </button>`;\n    const gateReadyButton =\n`              <button type=\"button\" id=\"downloadRisk\" class=\"secondary\">\n                Download Risk Assessment pre-fill\n              </button>\n              <button type=\"button\" id=\"downloadGateReady\" class=\"secondary\">\n                Download Gate-Ready / Decision-Ready pre-fill\n              </button>`;\n    if (!html.includes(riskButton)) throw new Error(\"Gate-Ready button insertion point not found.\");\n    html = html.replace(riskButton, gateReadyButton);\n  }\n\n      r.triggerIds.length ? logic.triggerTextFor(r.triggerIds).join(\"; \") : \"None\",\n      \"Carry into gate preparation\");\n\n    calculation.route.forEach((gate) => {\n      const gateLabel = \"Gate \" + gate.sequence;\n      add(\"Planned gate route\", gateLabel, \"Requirement\", gate.requirement, \"Planned route\");\n      add(\"Planned gate route\", gateLabel, \"Decision question\", gate.decision, \"For the named forum to decide\");\n      add(\"Planned gate route\", gateLabel, \"Forum\", gate.forum, \"Configurable forum name\");\n      add(\"Planned gate route\", gateLabel, \"Current planning status\", gate.status, \"Planning only\");\n      add(\"Planned gate route\", gateLabel, \"Required evidence\",\n        (gate.evidence || []).join(\"; \"),\n        \"Verify evidence before the forum decision\");\n      add(\"Planned gate route\", gateLabel, \"Handoff\", gate.handoff, \"Carry continuity forward\");\n      add(\"Planned gate route\", gateLabel, \"Actual decision\", \"\", \"MANUAL — populate only after the forum decides\");\n      add(\"Planned gate route\", gateLabel, \"Decision conditions\", \"\", \"MANUAL — populate only after the forum decides\");\n      add(\"Planned gate route\", gateLabel, \"Decision-maker / authority\", \"\", \"MANUAL — authoritative gate record\");\n      add(\"Planned gate route\", gateLabel, \"Decision date\", \"\", \"MANUAL — authoritative gate record\");\n    });\n\n    (calculation.evidence || []).forEach((item, idx) => {\n      add(\"Decision-ready evidence plan\", \"\", \"Evidence item \" + (idx + 1), item,\n        \"Required or indicated by triage — verify completion\");\n    });\n\n    [\n      [\"DPIA\", requirements.dpia || (requirements.dpiaScreening ? \"Screening required\" : \"Not indicated\")],\n      [\"Equality Impact Assessment\", requirements.eia || \"Not indicated\"],\n      [\"Human Rights Assessment\", requirements.humanRights ? \"Required / indicated\" : \"Not indicated\"],\n      [\"ATRS transparency publication\", requirements.atrs || \"Not indicated\"]\n    ].forEach(([name, value]) => {\n      add(\"Specialist assurance\", \"\", name, value,\n        \"Specialist owner confirms conclusion and evidence\");\n    });\n\n    if (latestAgentic) {\n      const a = latestAgentic;\n      add(\"Agentic assurance\", \"\", \"Agency Tier\", a.tierLabel, \"Derived by agentic triage — confirm\");\n      add(\"Agentic assurance\", \"\", \"Autonomy Level\", a.autonomyLabel, \"Derived by agentic triage — confirm\");\n      add(\"Agentic assurance\", \"\", \"Deployment Control\", a.deploymentControl, \"Must be satisfied before deployment\");\n      add(\"Agentic assurance\", \"\", \"Kill-switch demonstrated\", yesNo(a.killSwitch), \"Evidence required\");\n      add(\"Agentic assurance\", \"\", \"Rollback capability\", yesNo(a.rollback), \"Evidence required\");\n      add(\"Agentic assurance\", \"\", \"Boundaries tested\", yesNo(a.boundariesTested), \"Evidence required\");\n      add(\"Agentic assurance\", \"\", \"Worst plausible chain\", a.worstChain || \"\", \"Review in risk / assurance\");\n      add(\"Agentic assurance\", \"\", \"Agent Record / ASBOM reference\", a.asbomRef || \"\", \"Reference authoritative record\");\n    }\n\n    add(\"Authority boundary\", \"\", \"Gate-ready status\", \"PREPARATION / PRE-FILL ONLY\",\n      \"Feeds WCC-AIG-38 Decision-Ready Paper preparation. It does not verify evidence, record specialist sign-off, pass a gate or approve deployment.\");\n    add(\"Authority boundary\", \"\", \"Authoritative decision record\",\n      \"WCC-AIG-36 Gate Log / relevant forum record\",\n      \"Actual decisions, conditions, authority and dates are recorded only when the gate event occurs.\");\n\n    return logic.toCsv(\n      [\"Record Section\", \"Gate\", \"Field\", \"Value\", \"Status / Treatment\"],\n      rows\n    );\n  }\n\n  function gateReadyExport() {\n    if (!validateForExport()) return;\n    const calculation = update();\n    download(\n      safeSlug(calculation.profile.systemName) + \"-gate-ready-decision-ready-prefill.csv\",\n      gateReadyPrefillCsv(calculation),\n      \"text/csv;charset=utf-8\"\n    );\n  }\n\n`;\n    if (!html.includes(marker)) throw new Error(\"Gate-Ready function insertion point not found.\");\n    html = html.replace(marker, gateReadyFunctions + marker);\n  }\n\n  if (!html.includes('byId(\"downloadGateReady\").addEventListener')) {\n    const listener = '  byId(\"downloadRisk\").addEventListener(\"click\", riskExport);';\n    const replacement =\n      '  byId(\"downloadRisk\").addEventListener(\"click\", riskExport);\\n' +\n      '  byId(\"downloadGateReady\").addEventListener(\"click\", gateReadyExport);';\n    if (!html.includes(listener)) throw new Error(\"Gate-Ready listener insertion point not found.\");\n    html = html.replace(listener, replacement);\n  }\n\n  [\n    'id=\"downloadGateReady\"',\n    'function gateReadyPrefillCsv',\n    'gate-ready-decision-ready-prefill.csv',\n    'name: \"Non-agentic governance pathway\"',\n    'minimum effective risk tier is Critical',\n    'Model Card or system documentation'\n  ].forEach((needle) => {\n    if (!html.includes(needle)) throw new Error(\"Correction validation failed: \" + needle);\n  });\n\n  return html;\n}\n\nfunction addUiCorrections(html) {\n  html = html.replace(\n    '<div class=\"route-choice\" data-route-choice=\"standard\"><strong>Standard</strong><small>Normal governance assessment and assurance.</small><span class=\"state\">Available route</span></div>',\n    '<div class=\"route-choice\" data-route-choice=\"standard\"><strong>Non-agentic</strong><small>Risk may still be Low, Medium, High or Critical.</small><span class=\"state\">Available pathway</span></div>'\n  );\n\n  html = html.replace(\n    '<div class=\"route-choice is-agentic\" data-route-choice=\"agentic\"><strong>Enhanced / Agentic</strong><small>Systems that can act or exercise delegated authority.</small><span class=\"state\">Activates when the system can act</span></div>',\n    '<div class=\"route-choice is-agentic\" data-route-choice=\"agentic\"><strong>Agentic governance</strong><small>Applies when the system can act; unreviewed autonomous action imposes a Critical floor.</small><span class=\"state\">Activates when the system can act</span></div>'\n  );\n\n  html = html.replace(\n    '<div><strong>Route with oversight</strong><span>Light-touch, Standard and Enhanced / Agentic routes stay visible while authority remains with the right forums.</span></div>',\n    '<div><strong>Route with oversight</strong><span>Light-touch, Non-agentic and Agentic governance pathways stay visible while authority remains with the right forums.</span></div>'\n  );\n\n  html = html.replace(\n    'let key = txt.includes(\"agentic\") || txt.includes(\"enhanced\") ? \"agentic\" :\\n              txt.includes(\"light\") ? \"light\" : txt.includes(\"standard\") ? \"standard\" : \"\";',\n    'let key = txt.includes(\"non-agentic\") ? \"standard\" :\\n              txt.includes(\"agentic\") ? \"agentic\" :\\n              txt.includes(\"light\") ? \"light\" : txt.includes(\"standard\") ? \"standard\" : \"\";'\n  );\n\n  html = html.replace(\n    /  const agenticStep=document\\.getElementById\\(\"agenticStep\"\\);[\\s\\S]*?  syncAgentic\\(\\);\\n\\}\\);/,\n`  const agenticStep=document.getElementById(\"agenticStep\");\n  const capability=document.getElementById(\"capability\");\n  const actionAuthority=document.getElementById(\"actionAuthority\");\n  function syncAgentic(){\n    if(!agenticStep) return;\n    const trigger=document.querySelector('[data-trigger=\"agentic\"]');\n    const canAct=actionAuthority&&actionAuthority.value!==\"None — outputs only\";\n    const show=(capability&&capability.value===\"Agentic AI\")||canAct||(trigger&&trigger.checked);\n    agenticStep.hidden=!show;\n    syncSpectrum();\n  }\n  if(capability) capability.addEventListener(\"change\",syncAgentic);\n  if(actionAuthority) actionAuthority.addEventListener(\"change\",syncAgentic);\n  document.addEventListener(\"change\",function(e){\n    if(e.target&&e.target.matches('[data-trigger=\"agentic\"]')) syncAgentic();\n  });\n  syncAgentic();\n});`\n  );\n\n  html = html.replace(\n    'Download only the records you need. Pre-fill exports reuse the same triage data; approvals, specialist conclusions and monitoring evidence remain in their authoritative records.',\n    'Download only the records you need. The Gate-Ready / Decision-Ready pre-fill assembles the planned route and evidence requirements for decision preparation; approvals, specialist conclusions, gate decisions and monitoring evidence remain in their authoritative records.'\n  );\n\n  html = html.replace(\n    '</style></head>',\n    '#downloadGateReady{background:var(--goldsoft)!important;color:var(--navy)!important;border-color:var(--gold)!important;}\\n</style></head>'\n  );\n\n  return html;\n}\n";

function patchCurrentWrapper(src) {
  const functionMarker = "function applyProfessionalDesign(html){";
  if (!src.includes(functionMarker)) {
    throw new Error("Current wrapper structure changed: design marker not found.");
  }
  src = src.replace(functionMarker, CORRECTION_FUNCTIONS + "\n" + functionMarker);

  const pipeline =
`    const functionallyPatched=patch(original);
    const withAgenticGovernance=addAgenticGovernanceExport(functionallyPatched);
    const redesigned=applyProfessionalDesign(withAgenticGovernance);
    document.open();document.write(redesigned);document.close();`;

  const correctedPipeline =
`    const functionallyPatched=patch(original);
    const withAgenticGovernance=addAgenticGovernanceExport(functionallyPatched);
    const correctedGovernance=addGovernanceCorrections(withAgenticGovernance);
    const redesigned=applyProfessionalDesign(correctedGovernance);
    const correctedUi=addUiCorrections(redesigned);
    document.open();document.write(correctedUi);document.close();`;

  if (!src.includes(pipeline)) {
    throw new Error("Current wrapper structure changed: boot pipeline not found.");
  }
  src = src.replace(pipeline, correctedPipeline);
  return src;
}

async function boot(){
  const host=document.getElementById("loader");
  try{
    const res=await fetch(CURRENT_WRAPPER,{cache:"no-store"});
    if(!res.ok) throw new Error("Unable to load pinned governance build (HTTP "+res.status+").");
    const current=await res.text();
    const corrected=patchCurrentWrapper(current);
    document.open();
    document.write(corrected);
    document.close();
  }catch(err){
    host.innerHTML="<h1>AI Governance Triage &amp; Routing</h1>"+
      '<p class="error"><strong>The corrected governance tool could not load.</strong><br>'+
      String(err.message||err)+
      "<br><br>No governance data has been submitted or altered.</p>";
  }
}
boot();
})();
